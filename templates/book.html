{% extends 'base.html' %}

{% block title %}Book a Table | Little Lemon Restaurant{% endblock %}

{% block content %}
<div class="container">
    <div class="section-title">
        <h2>Reserve a Table</h2>
        <p>Book your dining experience with us</p>
    </div>

    <div class="booking-box">
        <form id="booking-form" onsubmit="handleBookingSubmit(event)">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" placeholder="e.g. John Doe" required>
            </div>

            <div class="form-group">
                <label for="no_of_guests">Number of Guests</label>
                <input type="number" id="no_of_guests" name="no_of_guests" min="1" max="20" value="2" required>
            </div>

            <div class="form-group">
                <label for="booking_date">Reservation Date</label>
                <input type="date" id="booking_date" name="booking_date" required>
            </div>

            <div class="form-group">
                <label for="booking_time">Reservation Time</label>
                <select id="booking_time" name="booking_time" required>
                    <option value="17:00:00">5:00 PM</option>
                    <option value="18:00:00" selected>6:00 PM</option>
                    <option value="19:00:00">7:00 PM</option>
                    <option value="20:00:00">8:00 PM</option>
                    <option value="21:00:00">9:00 PM</option>
                </select>
            </div>

            <div class="form-group">
                <label for="api_token">API Token (Optional for Web Preview, required for API auth)</label>
                <input type="text" id="api_token" name="api_token" placeholder="Paste Token if testing authenticated reservation">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">Confirm Reservation</button>
        </form>

        <div id="booking-result" style="margin-top: 1.5rem; display: none; padding: 1rem; border-radius: 8px;"></div>
    </div>
</div>

<script>
    // Set default date to tomorrow
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    document.getElementById('booking_date').value = tomorrow.toISOString().split('T')[0];

    async function handleBookingSubmit(event) {
        event.preventDefault();
        const resultDiv = document.getElementById('booking-result');
        const token = document.getElementById('api_token').value.trim();

        const payload = {
            name: document.getElementById('name').value,
            no_of_guests: parseInt(document.getElementById('no_of_guests').value, 10),
            booking_date: document.getElementById('booking_date').value,
            booking_time: document.getElementById('booking_time').value
        };

        const headers = {
            'Content-Type': 'application/json'
        };
        if (token) {
            headers['Authorization'] = `Token ${token}`;
        }

        resultDiv.style.display = 'block';
        resultDiv.style.background = '#eef2ff';
        resultDiv.style.color = '#333';
        resultDiv.innerText = 'Submitting reservation request to /restaurant/booking/tables/...';

        try {
            const response = await fetch('/restaurant/booking/tables/', {
                method: 'POST',
                headers: headers,
                body: JSON.stringify(payload)
            });

            const data = await response.json();
            if (response.ok) {
                resultDiv.style.background = '#e6f4ea';
                resultDiv.style.color = '#137333';
                resultDiv.innerHTML = `<strong>Success!</strong> Reservation confirmed for ${data.name}. Reference: <code>${data.booking_reference || data.id}</code>`;
            } else {
                resultDiv.style.background = '#fce8e6';
                resultDiv.style.color = '#c5221f';
                resultDiv.innerHTML = `<strong>Error (${response.status}):</strong> ${JSON.stringify(data)}`;
            }
        } catch (err) {
            resultDiv.style.background = '#fce8e6';
            resultDiv.style.color = '#c5221f';
            resultDiv.innerText = `Network/Server Error: ${err.message}`;
        }
    }
</script>
{% endblock %}
